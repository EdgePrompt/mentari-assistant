name: Sync Release to SourceForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  sync-sourceforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag and assets
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG_INPUT" --pattern "*.zip" --dir dist || true
          if [ -z "$(ls -A dist/*.zip 2>/dev/null || true)" ]; then
            zip_name="mentari-assistant-${TAG_INPUT}.zip"
            zip -r "dist/${zip_name}" manifest.json LICENSE README.md src -x "*.DS_Store" -x "*/.DS_Store"
            gh release upload "$TAG_INPUT" "dist/${zip_name}" --clobber
          fi
          echo "tag=${TAG_INPUT}" >> "$GITHUB_OUTPUT"

      - name: Upload release zip to SourceForge
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_API_KEY: ${{ secrets.SF_API_KEY }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -z "$SF_USERNAME" ] || [ -z "$SF_SSH_KEY" ]; then
            echo "Missing SF_USERNAME or SF_SSH_KEY repository secrets." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sf_ed25519
          chmod 600 ~/.ssh/sf_ed25519
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

          remote_dir="/home/frs/project/mentari-assistant/${RELEASE_TAG}"
          rsync -avz -e "ssh -i ~/.ssh/sf_ed25519" dist/*.zip "${SF_USERNAME}@frs.sourceforge.net:${remote_dir}/"

          if [ -n "$SF_API_KEY" ]; then
            for zip_file in dist/*.zip; do
              zip_base="$(basename "$zip_file")"
              curl -fsSL -X PUT \
                -H "Accept: application/json" \
                -d "default=windows&default=mac&default=linux&default=bsd&default=solaris&default=others" \
                -d "api_key=${SF_API_KEY}" \
                "https://sourceforge.net/projects/mentari-assistant/files/${RELEASE_TAG}/${zip_base}" >/dev/null || true
            done
          fi
