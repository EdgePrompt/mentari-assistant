<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentari Assistant</title>
    <style>
      :root {
        --bg-panel: #0f1115;
        --bg-surface: #161920;
        --bg-elevated: #1e222b;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.16);
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --accent: #f97316;
        --accent-hover: #ea580c;
        --accent-soft: rgba(249, 115, 22, 0.14);
        --success: #22c55e;
        --success-text: #4ade80;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        width: 320px;
        background: var(--bg-panel);
        color: var(--text-primary);
        padding: 14px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo-img {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.2;
      }
      .subtitle {
        font-size: 10px;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .badge {
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
        font-size: 10.5px;
        font-weight: 700;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .card {
        margin-top: 12px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        padding: 12px;
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6b7280;
        flex-shrink: 0;
      }
      .dot.active {
        background: var(--success);
      }
      .desc {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.45;
        color: var(--text-secondary);
      }
      .btn {
        margin-top: 12px;
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 9px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        color: #ffffff;
        background: var(--accent);
        transition: background 0.15s ease, transform 0.12s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn:hover {
        background: var(--accent-hover);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .info-grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .info-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .info-label {
        font-size: 10px;
        color: var(--text-secondary);
      }
      .info-val {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .info-val.ready {
        color: var(--success-text);
      }
      .info-val.standby {
        color: var(--text-secondary);
      }
      .footer {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: var(--text-secondary);
      }
      .footer-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--accent);
        text-decoration: none;
      }
      .footer-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <img src="../assets/icon-128.png" alt="Mentari Assistant" class="logo-img" />
        <div>
          <div class="title">Mentari Assistant</div>
          <div class="subtitle">by EdgePrompt</div>
        </div>
      </div>
      <span class="badge">v1.3.1</span>
    </div>

    <div class="card">
      <div class="status-row">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Memeriksa halaman...</span>
      </div>
      <p id="statusDesc" class="desc">
        Menghubungkan ke halaman MENTARI UNPAM.
      </p>
      <button id="actionBtn" class="btn">
        <svg id="btnIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span id="btnText">Buka MENTARI</span>
      </button>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <span class="info-label">Model AI</span>
        <span id="activeModelTag" class="info-val">3.5 Flash Lite</span>
      </div>
      <div class="info-card">
        <span class="info-label">Status</span>
        <span id="portalStatusTag" class="info-val standby">Standby</span>
      </div>
    </div>

    <div class="footer">
      <span>MENTARI UNPAM</span>
      <a href="https://github.com/EdgePrompt/mentari-assistant" target="_blank" class="footer-link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>

    <script src="script.js"></script>
  </body>
</html>
